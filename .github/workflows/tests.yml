name: Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt "fastapi==0.115.12"
      - run: python -m pytest -q tests
  lab4:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m src.make_sample
      - run: python -m src.run_dvc repro
      - run: python -m src.demo
